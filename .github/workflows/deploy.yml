name: Deploy manual (sob demanda)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env com secrets
        run: |
          cat > .env << EOF
          HOSTINGER_FTP_HOST=${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER=${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASS=${{ secrets.HOSTINGER_FTP_PASS }}
          HOSTINGER_FTP_DIR=${{ secrets.HOSTINGER_FTP_DIR }}
          EOF

      - name: Build + Deploy (OG, Astro, Pagefind, FTP)
        run: npm run deploy
