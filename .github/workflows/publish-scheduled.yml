name: Publicar Posts Agendados

on:
  # Agendamento agora é feito pelo n8n na VPS (dispara via workflow_dispatch).
  # Cron do GitHub removido por ser instável (execuções puladas). Ver n8n/README.md.
  workflow_dispatch:

permissions:
  contents: write

# n8n + redisparo + cron podem coincidir: uma execução por vez, a segunda espera
concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env com secrets
        run: |
          cat > .env << EOF
          HOSTINGER_FTP_HOST=${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER=${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASS=${{ secrets.HOSTINGER_FTP_PASS }}
          HOSTINGER_FTP_DIR=${{ secrets.HOSTINGER_FTP_DIR }}
          ML_AFFILIATE_ID=${{ secrets.ML_AFFILIATE_ID }}
          EOF

      # 1) Só troca draft:true → false (sem deploy)
      - name: Marcar posts vencidos como publicados
        run: node scripts/publish-scheduled.mjs --no-deploy

      # 2) Commit ANTES do deploy: se o FTP cair, o estado dos posts já está salvo e a
      #    próxima execução completa o deploy (o passo 3 confere o site ao vivo)
      - name: Commit dos posts publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/
          if git diff --staged --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "chore: publicar posts agendados [$(date +'%Y-%m-%d')]"
            git pull --rebase
            git push
          fi

      # 3) Confere no site ao vivo os posts dos últimos 14 dias; o que estiver fora do ar
      #    (agora ou de execução anterior que falhou) é publicado e verificado com HTTP 200
      - name: Deploy e verificação no site ao vivo
        run: node scripts/publish-scheduled.mjs --deploy-only
